# Tầng 1 (headless core). Kiểm thử bằng tests/ (chạy trong CI).
# Phiên bản image cố định để build tái lập được; cập nhật có chủ đích.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # Chế độ production của Keycloak (không phải start-dev). HTTP bật vì TLS do lớp ngoài (reverse proxy) đảm nhiệm khi triển khai thật.
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      # Issuer trong token cố định theo địa chỉ công khai; dịch vụ nội bộ vẫn gọi được qua keycloak:8080.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Đứng sau Caddy (profile tls) thì tin các header X-Forwarded-* để tạo đúng địa chỉ https.
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    healthcheck:
      # Image Keycloak không có curl; gọi /health/ready (cổng quản trị 9000) bằng bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

  hasura:
    image: hasura/graphql-engine:v2.40.0
    restart: unless-stopped
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      # Xác thực JWT bằng khóa công khai (JWKS) của Keycloak; role lấy từ realm role, user id = sub.
      # Mọi người dùng phải có role `staff` (role mặc định); client gửi header x-hasura-role để dùng role khác.
      HASURA_GRAPHQL_JWT_SECRET: '{"jwk_url":"http://keycloak:8080/realms/dxlab/protocol/openid-connect/certs","claims_map":{"x-hasura-allowed-roles":{"path":"$$.realm_access.roles"},"x-hasura-default-role":"staff","x-hasura-user-id":{"path":"$$.sub"},"x-hasura-user-name":{"path":"$$.name","default":""},"x-hasura-org-id":{"path":"$$.org_id","default":"default"}}}'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Chạy một lần: nạp bảng, quan hệ và phân quyền theo dòng vào Hasura.
  hasura-init:
    image: curlimages/curl:8.10.1
    restart: "no"
    command: ["-fsS", "-X", "POST", "-H", "X-Hasura-Admin-Secret: ${HASURA_ADMIN_SECRET}", "-H", "Content-Type: application/json", "-d", "@/metadata.json", "http://hasura:8080/v1/metadata"]
    volumes:
      - ./infra/hasura/metadata.json:/metadata.json:ro
    depends_on:
      hasura:
        condition: service_healthy

  # Động cơ quy trình BPMN (chỉ REST API, không giao diện).
  flowable:
    image: flowable/flowable-rest:7.2.0
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FLOWABLE_REST_APP_ADMIN_USERID: ${FLOWABLE_USER}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Authorization: Basic $$(printf %s \"$$FLOWABLE_REST_APP_ADMIN_USERID:$$FLOWABLE_REST_APP_ADMIN_PASSWORD\" | base64)\" http://127.0.0.1:8080/flowable-rest/service/management/engine"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Biên dịch ứng dụng (spec -> BPMN + view) và nối sự kiện Hasura -> Flowable. Mã nguồn: services/workflow-bridge.
  workflow-bridge:
    image: node:22.19.0-alpine
    restart: unless-stopped
    working_dir: /app
    command: node bridge.js
    environment:
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      FLOWABLE_URL: http://flowable:8080/flowable-rest/service
      FLOWABLE_USER: ${FLOWABLE_USER}
      FLOWABLE_PASSWORD: ${FLOWABLE_PASSWORD}
      HASURA_URL: http://hasura:8080
      S3_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Khóa mã hóa khóa riêng của CA/người ký (chữ ký số); trống thì dùng HASURA_ADMIN_SECRET.
      PKI_MASTER_KEY: ${PKI_MASTER_KEY:-}
      # Quản trị người dùng của tổ chức (Keycloak Admin API); xem docs/VAN_HANH.md, mục Nhiều tổ chức.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      CLAMAV_HOST: clamav
      # Máy được nhận thông báo thuê bao NGSI-LD, dạng "máy:cổng,máy-khác" (trống là cấm gửi). Chặn bridge bị lợi dụng gọi vào mạng nội bộ.
      NGSI_NOTIFY_ALLOW: ${NGSI_NOTIFY_ALLOW:-}
      # Tên máy được phép trỏ vào địa chỉ nội bộ; còn lại địa chỉ nội bộ, link-local và metadata đám mây đều bị chặn lúc gửi.
      NGSI_NOTIFY_PRIVATE: ${NGSI_NOTIFY_PRIVATE:-}
      NGSI_MAX_SUBSCRIPTIONS: ${NGSI_MAX_SUBSCRIPTIONS:-50}
      # Trục sự kiện (tùy chọn, profile stream ở docker-compose.optional.yml): đặt NATS_URL=nats://nats:4222; trống là tắt.
      NATS_URL: ${NATS_URL:-}
      NATS_TOKEN: ${NATS_TOKEN:-change-me-nats-token}
      # Tìm kiếm và hỏi đáp (tùy chọn): chỉ hoạt động khi bật profile search ở docker-compose.optional.yml.
      MEILI_URL: http://meilisearch:7700
      EXTRACTOR_URL: http://extractor:8000
      # Tìm ngữ nghĩa (tùy chọn): tên mô hình HuggingFace, khuyên dùng sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 (ghim bằng tên@mã-commit); trống là chỉ tìm từ khóa.
      SEARCH_EMBEDDER: ${SEARCH_EMBEDDER:-}
      SEARCH_SEMANTIC_RATIO: ${SEARCH_SEMANTIC_RATIO:-0.5}
      # Tìm ngữ nghĩa tách riêng (profile vector): đặt VECTOR_URL=http://qdrant:6333 và EMBED_URL=http://embedder thì SEARCH_EMBEDDER bị bỏ qua.
      VECTOR_URL: ${VECTOR_URL:-}
      VECTOR_API_KEY: ${VECTOR_API_KEY:-change-me-vector-key}
      EMBED_URL: ${EMBED_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-change-me-embed-key}
      # Tiền tố riêng của mô hình nhúng (chỉ khi mô hình yêu cầu); mô hình mặc định không cần.
      EMBED_QUERY_PREFIX: ${EMBED_QUERY_PREFIX:-}
      EMBED_DOC_PREFIX: ${EMBED_DOC_PREFIX:-}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-meili-key}
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      # Trợ lý AI (tùy chọn): mọi máy chủ tương thích OpenAI /chat/completions (Ollama, vLLM, Mistral...).
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - ./services/workflow-bridge:/app:ro
      - ./library:/library:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:3000/ 2>&1 | grep -q HTTP/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Lưu trữ đối tượng chuẩn S3 (thay MinIO: image cộng đồng không còn trên Docker Hub).
  # Xác thực AWS SigV4 bắt buộc: khóa quản trị lấy từ .env (S3_ACCESS_KEY/S3_SECRET_KEY); cổng S3 không mở ra ngoài.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    command: server -dir=/data -s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Trạm kiểm dịch mã độc (ClamAV, GPL-2.0, chạy tách riêng, không sửa). Mọi tệp tải lên phải qua đây.
  # Lần đầu khởi động tải cơ sở dữ liệu mẫu nhận dạng (vài phút); cần khoảng 1,5 GB RAM.
  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    environment:
      CLAMD_STARTUP_TIMEOUT: 600
      # Nạp lại mẫu nhận dạng sau khi tự cập nhật theo kiểu tuần tự: không giữ hai bản (~2 GB) cùng lúc, máy 4 GB bật thêm profile vector không bị hết RAM; đổi lại quét tạm chờ vài chục giây mỗi lần nạp.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 60s

  apisix:
    image: apache/apisix:3.9.1-debian
    restart: unless-stopped
    # Chế độ standalone khai báo trong config.yaml; không đặt APISIX_STAND_ALONE vì entrypoint sẽ ghi đè tệp cấu hình.
    environment:
      APP_ORIGIN: ${APP_ORIGIN}
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "9080:9080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9080'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      - hasura
      - keycloak

  # Tầng 2: ứng dụng web (Vue 3). Mã nguồn: web/.
  web:
    build: ./web
    restart: unless-stopped
    environment:
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      - apisix

volumes:
  pgdata:
  s3data:
  clamdb:
