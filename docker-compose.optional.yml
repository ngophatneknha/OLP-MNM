# Thành phần tùy chọn, không cần cho đề thi nên tách khỏi docker-compose.yml (máy yếu vẫn chạy được bản lõi).
#   TLS tại biên:  docker compose -f docker-compose.yml -f docker-compose.optional.yml --profile tls up -d
#   Giám sát:      docker compose -f docker-compose.yml -f docker-compose.optional.yml --profile monitoring up -d
#   Tường lửa ứng dụng (Coraza + OWASP CRS, cổng 9081 trước cổng API): ... --profile waf up -d --build
#   Két bí mật OpenBao: sh scripts/vault.sh init (xem docs/VAN_HANH.md, mục "Két bí mật")
#   Tìm kiếm toàn văn và hỏi đáp: ... --profile search up -d
#   Sao lưu tự động theo lịch:   ... --profile backup up -d   (xem docs/VAN_HANH.md)
#   SQL trên kho lạnh (DuckDB):   sh scripts/cold-sql.sh "SELECT ..."   (profile lakehouse)
#   Bảng Iceberg của kho lạnh:    sh scripts/lake.sh sync | info | sql "SELECT ... FROM lake"
#   Gom nhật ký tập trung:      ... --profile logs up -d    (Vector -> VictoriaLogs, tìm theo request_id)
#   Trục sự kiện NATS:          NATS_URL=nats://nats:4222 ... --profile stream up -d   (xem docs/VAN_HANH.md)
#   Mô hình AI chạy tại chỗ:      ... --profile ai up -d
# Hướng dẫn: docs/VAN_HANH.md, docs/TRI_TUE.md

services:
  # SQL trực tiếp trên tệp JSONL của kho lạnh (DuckDB đọc S3): chạy một lần mỗi câu truy vấn, dùng scripts/cold-sql.sh.
  # Cùng ảnh đó nạp kho lạnh vào bảng Apache Iceberg (tệp Parquet trong S3, danh mục trong PostgreSQL): scripts/lake.sh.
  lakehouse:
    build: ./infra/duckdb
    profiles: ["lakehouse"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      seaweedfs:
        condition: service_healthy

  # Sao lưu CSDL theo lịch vào ./backups (mặc định mỗi 24 giờ, giữ 7 bản). Kho tệp S3: dùng scripts/backup.sh.
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: ["sh", "/backup-loop.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_ONCE: ${BACKUP_ONCE:-}
    volumes:
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # TLS tại biên: Caddy cấp chứng chỉ nội bộ (tls internal) cho web, API và đăng nhập. Triển khai thật thì thay bằng tên miền để Caddy tự lấy chứng chỉ Let's Encrypt.
  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["tls"]
    restart: unless-stopped
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    ports:
      - "8443:8443"
      - "9443:9443"
      - "8444:8444"
    depends_on:
      - web
      - apisix
      - keycloak

  # Tường lửa ứng dụng web (Coraza + OWASP CRS) đứng trước cổng API, mở cổng ${WAF_PORT:-9081}. Dựng từ infra/coraza (xcaddy).
  waf:
    build: ./infra/coraza
    profiles: ["waf"]
    restart: unless-stopped
    volumes:
      - ./infra/coraza/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${WAF_PORT:-9081}:9081"
    depends_on:
      - apisix

  # Trạm đọc chữ từ PDF và ảnh (poppler + Tesseract) cho tìm kiếm; bật cùng profile search. Chỉ mạng nội bộ.
  extractor:
    build: ./infra/extractor
    profiles: ["search"]
    restart: unless-stopped

  # Két bí mật OpenBao (MPL-2.0, nhánh mã nguồn mở của Vault): chỉ mạng nội bộ, không công bố cổng. Điều khiển bằng scripts/vault.sh.
  openbao:
    image: quay.io/openbao/openbao:2.1.0
    profiles: ["vault"]
    restart: unless-stopped
    command: server
    environment:
      BAO_LOCAL_CONFIG: '{"storage":{"file":{"path":"/openbao/file"}},"listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}],"disable_mlock":true,"ui":false}'
    volumes:
      - baodata:/openbao/file

  # Thu thập số đo của cổng API (APISIX) mỗi 15 giây và có giao diện truy vấn sẵn. Không dùng Grafana vì giấy phép AGPL-3.0, trái với chính sách của dự án (THIRD_PARTY.md).
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9092}:9090"
    depends_on:
      - apisix

  # Tìm kiếm toàn văn hồ sơ và tệp đính kèm dạng văn bản. Không công bố cổng: chỉ workflow-bridge gọi tới, và chính nó kiểm quyền từng kết quả.
  meilisearch:
    image: getmeili/meilisearch:v1.57.0 # bản Community (MIT); KHÔNG dùng image meilisearch-enterprise (BUSL)
    profiles: ["search"]
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-meili-key}
      MEILI_NO_ANALYTICS: "true"
      # Máy yếu: nhúng chạy bằng CPU. Giới hạn luồng và bộ nhớ khi nạp để Meilisearch không chiếm hết máy và không bị tắt vì hết RAM.
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-2}
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-512 MiB}
    volumes:
      - meilidata:/meili_data
      - meilimodels:/root/.cache/huggingface # mô hình nhúng (~470 MB): dựng lại container hay xóa chỉ mục không phải tải lại (Meili bỏ qua HF_HOME)

  # Tìm ngữ nghĩa tách riêng (profile vector): Qdrant lưu véc-tơ, dịch vụ nhúng chạy mô hình bằng CPU.
  # Không dùng Ollama nên không tranh tài nguyên với mô hình ngôn ngữ. Bật thì đặt VECTOR_URL và EMBED_URL (xem .env.example).
  qdrant:
    image: qdrant/qdrant:v1.20.2 # Apache-2.0
    profiles: ["vector"]
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${VECTOR_API_KEY:-change-me-vector-key}
      QDRANT__TELEMETRY_DISABLED: "true"
      # Máy yếu: giới hạn luồng và gộp ít phân đoạn; đã đo trên máy 4 nhân: RAM ~120 MB, độ đúng không đổi.
      QDRANT__SERVICE__MAX_WORKERS: 2
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 2
      QDRANT__STORAGE__PERFORMANCE__OPTIMIZER_CPU_BUDGET: 1
      QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER: 2
    volumes:
      - qdrantdata:/qdrant/storage

  # Tải mô hình mặc định một lần vào volume: bản lượng tử int8 chính thức của MiniLM (118 MB), kiểm sha256 từng tệp.
  # Dịch vụ nhúng tự tải chỉ lấy được bản fp32; bản int8 đã đo: cùng độ đúng 33/39, RAM 0,48 GB thay vì 0,96 GB, nhanh hơn (cần CPU có AVX2).
  embedder-model:
    image: alpine:3.21 # MIT; wget của BusyBox (GPL-2.0), chỉ chạy, không phân phối lại
    profiles: ["vector"]
    volumes:
      - embedmodel:/model
    entrypoint:
      - sh
      - -ec
      - |
        cd /model
        base=https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2/resolve/e8f8c211226b894fcb81acc59f3b34ba3efd5f42
        while read -r sum dst src; do
          if [ -f "$$dst" ] && echo "$$sum  $$dst" | sha256sum -c >/dev/null 2>&1; then continue; fi
          mkdir -p "$$(dirname "$$dst")"
          for try in 1 2 3 4 5; do wget -q -c -O "$$dst.part" "$$base/$$src" && break; sleep 5; done # mạng chập chờn: tải tiếp phần dở
          if ! echo "$$sum  $$dst.part" | sha256sum -c >/dev/null 2>&1; then rm -f -- "$$dst.part"; echo "Sai sha256: $$src"; exit 1; fi
          mv "$$dst.part" "$$dst"
        done <<'LIST'
        6300193cb75e01cf80c96decef7187dfb33094d97cc1490b7ead6ff134476e4e config.json config.json
        2c3387be76557bd40970cec13153b3bbf80407865484b209e655e5e4729076b8 tokenizer.json tokenizer.json
        70f4448f31320443fe3557cacea5abf2dcc4915dda8c80646bec9f3bb0aa5a1f sentence_bert_config.json sentence_bert_config.json
        4be450dde3b0273bb9787637cfbd28fe04a7ba6ab9d36ac48e92b11e350ffc23 1_Pooling/config.json 1_Pooling/config.json
        98a01d88b7de996cdea58c32ca71208c09968d143798814b2ea09d3439dc334f onnx/model.onnx onnx/model_quint8_avx2.onnx
        LIST

  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9 # Text Embeddings Inference, Apache-2.0
    profiles: ["vector"]
    restart: unless-stopped
    depends_on:
      embedder-model:
        condition: service_completed_successfully
    # Mặc định chạy bản int8 ở trên. Máy chủ dư RAM/CPU có thể đặt EMBED_MODEL (tên trên Hugging Face) và EMBED_REVISION (mã commit) để dùng mô hình khác,
    # ví dụ gte-multilingual-base (đúng 39/39 nhưng RAM 1,56 GB, nạp chậm gấp 10 lần). Đổi mô hình chỉ cần khởi động lại workflow-bridge:
    # nó dựng lại kho véc-tơ và nhúng lại toàn bộ (đặt EMBED_*_PREFIX nếu mô hình mới cần tiền tố).
    command: ["--model-id", "${EMBED_MODEL:-/model}", "--revision", "${EMBED_REVISION:-main}", "--api-key", "${EMBED_API_KEY:-change-me-embed-key}", "--max-batch-tokens", "2048", "--tokenization-workers", "1"] # lô nhỏ: giảm RAM, độ đúng không đổi (đã đo)
    volumes:
      - embedmodel:/model:ro
      - embedmodels:/data # mô hình khác (EMBED_MODEL) tải một lần vào đây

  # Mô hình ngôn ngữ chạy tại chỗ (không gửi dữ liệu ra ngoài). Cần tải mô hình một lần, xem docs/TRI_TUE.md.
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama

  # Kho nhật ký tập trung (profile logs). Chỉ mở cổng trên 127.0.0.1 của máy chủ cho người vận hành (giao diện tìm kiếm ở /select/vmui).
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0 # bản cộng đồng Apache-2.0; KHÔNG dùng thẻ -enterprise
    profiles: ["logs"]
    restart: unless-stopped
    command: ["-storageDataPath=/vlogs", "-retentionPeriod=${LOGS_RETENTION:-14d}", "-httpListenAddr=:9428"]
    volumes:
      - vlogsdata:/vlogs
    ports:
      - "127.0.0.1:9428:9428"

  # Bộ gom nhật ký (profile logs): đọc nhật ký container qua Docker API. Socket gắn chỉ đọc nhưng vẫn cho Vector thấy mọi container
  # trên máy, nên chỉ bật trên máy chủ do đội vận hành quản lý (xem docs/VAN_HANH.md).
  vector:
    image: timberio/vector:0.61.0-alpine # MPL-2.0, chạy container riêng, không sửa mã
    profiles: ["logs"]
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-olp-mnm}
    volumes:
      - ./infra/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - victorialogs

  # Trục sự kiện streaming (profile stream): NATS JetStream lưu tin trên đĩa, phát lại được. workflow-bridge phát sự kiện duyệt
  # hồ sơ theo mẫu outbox khi đặt NATS_URL=nats://nats:4222. Cổng chỉ mở trên 127.0.0.1 của máy chủ, cần token.
  nats:
    image: nats:2.14.10-alpine # Apache-2.0
    profiles: ["stream"]
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "--auth", "${NATS_TOKEN:-change-me-nats-token}", "-m", "8222"]
    volumes:
      - natsdata:/data
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz?js-enabled-only=true | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vlogsdata:
  natsdata:
  baodata:
  meilidata:
  meilimodels:
  qdrantdata:
  embedmodel:
  embedmodels:
  ollamadata:
  caddydata:
  promdata:
