name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reuse:
    name: Kiểm tra giấy phép (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v4

  smoke:
    name: Dựng hệ thống từ đầu và smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test services/workflow-bridge/compile.test.js web/src/metrics.test.js
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: sh scripts/smoke.sh
      - if: failure()
        run: docker compose ps -a && docker compose logs --tail=80
