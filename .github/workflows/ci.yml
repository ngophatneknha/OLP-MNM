name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reuse:
    name: Kiểm tra giấy phép (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v4

  kiem-thu:
    name: Kiểm thử đối chiếu đề thi trên hệ thống thật
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # kiểm thử PoF cần lịch sử commit và thẻ phiên bản đầy đủ
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install reuse
      - run: npm ci --no-audit --no-fund && npm run lint && npm run build
        working-directory: web
      - name: Kiểm thử đơn vị (web cần vue đã cài ở bước trên)
        run: node --test services/workflow-bridge/*.test.js web/src/*.test.js
      - name: Dựng hệ thống từ đầu
        run: |
          cp .env.example .env
          docker compose up -d --build
          node tests/wait-ready.js 900
      - name: Kiểm thử Tầng 1, H-P-D-I và PoF
        run: node --test --test-reporter=spec tests/*.test.js
      - name: TLS, giám sát, tìm kiếm, tường lửa, két bí mật (thành phần tùy chọn)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.optional.yml --profile tls --profile monitoring --profile search --profile waf --profile vault up -d --build
          node tests/wait-ready.js 300
          OPS_OPTIONAL=1 SEARCH_OPTIONAL=1 WAF_OPTIONAL=1 VAULT_OPTIONAL=1 node --test --test-reporter=spec tests/ops.test.js tests/search.test.js tests/hpdi.test.js
      - name: Tự phục hồi khi dịch vụ gặp sự cố
        run: RECOVERY_TEST=1 node --test --test-reporter=spec tests/recovery.test.js
      - name: Dữ liệu mẫu cho bản demo cho điểm hợp lý
        run: |
          docker compose exec -T workflow-bridge node seed.js --force
          node --test --test-reporter=spec tests/demo.check.js
      - name: Sao lưu và khôi phục thảm họa
        run: RESTORE_TEST=1 node --test --test-reporter=spec tests/restore.test.js
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.optional.yml ps -a && docker compose -f docker-compose.yml -f docker-compose.optional.yml logs --tail=80 workflow-bridge meilisearch
