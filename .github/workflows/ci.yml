name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reuse:
    name: Kiểm tra giấy phép (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v4

  compose:
    name: Kiểm tra cú pháp Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
