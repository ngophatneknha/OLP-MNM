name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reuse:
    name: Kiểm tra giấy phép (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v4

  kiem-thu:
    name: Kiểm thử đối chiếu đề thi trên hệ thống thật
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # kiểm thử PoF cần lịch sử commit và thẻ phiên bản đầy đủ
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install reuse
      - name: Kiểm thử đơn vị
        run: node --test services/workflow-bridge/*.test.js web/src/metrics.test.js web/src/i18n.test.js
      - run: npm ci --no-audit --no-fund && npm run lint && npm run build
        working-directory: web
      - name: Dựng hệ thống từ đầu
        run: |
          cp .env.example .env
          docker compose up -d --build
          node tests/wait-ready.js 900
      - name: Kiểm thử Tầng 1, H-P-D-I và PoF
        run: node --test --test-reporter=spec tests/*.test.js
      - name: TLS và giám sát (thành phần tùy chọn)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.optional.yml --profile tls --profile monitoring up -d
          OPS_OPTIONAL=1 node --test --test-reporter=spec tests/ops.test.js
      - name: Sao lưu và khôi phục thảm họa
        run: RESTORE_TEST=1 node --test --test-reporter=spec tests/restore.test.js
      - if: failure()
        run: docker compose ps -a && docker compose logs --tail=80
