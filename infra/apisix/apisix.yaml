# Cổng vào duy nhất của ứng dụng. Route nghiệp vụ bắt buộc có JWT hợp lệ của Keycloak
# (kiểm tra chữ ký bằng JWKS ngay tại biên), có CORS và giới hạn tần suất.
# Biến ${{...}} lấy từ môi trường của container (xem docker-compose.yml).

# Mã truy vết X-Request-Id: xem global_rules cuối tệp.
routes:
  - id: graphql
    uri: /v1/graphql
    enable_websocket: true
    plugins:
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "POST,OPTIONS"
        allow_headers: "authorization,content-type,x-hasura-role"
      limit-count:
        count: 900
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      openid-connect:
        client_id: dxlab-app
        client_secret: not-used-public-client
        discovery: http://keycloak:8080/realms/dxlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
    upstream:
      type: roundrobin
      nodes:
        "hasura:8080": 1
  - id: files
    uris: ["/files", "/files/*"]
    plugins:
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "authorization,content-type,x-hasura-role,x-submission-id,x-file-name"
      limit-count:
        count: 60
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      openid-connect:
        client_id: dxlab-app
        client_secret: not-used-public-client
        discovery: http://keycloak:8080/realms/dxlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
    upstream:
      type: roundrobin
      nodes:
        "workflow-bridge:3000": 1
  - id: events
    uris: ["/events"]
    plugins:
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "GET,OPTIONS"
        allow_headers: "authorization,x-hasura-role"
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      openid-connect:
        client_id: dxlab-app
        client_secret: not-used-public-client
        discovery: http://keycloak:8080/realms/dxlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
    upstream:
      type: roundrobin
      timeout:
        connect: 6
        send: 6
        read: 3600
      nodes:
        "workflow-bridge:3000": 1
  - id: data
    uris: ["/archive", "/archive/*", "/lineage", "/lineage/*", "/audit", "/audit/*", "/ingest", "/sensors"]
    plugins:
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "authorization,content-type,x-hasura-role"
      limit-count:
        count: 60
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      openid-connect:
        client_id: dxlab-app
        client_secret: not-used-public-client
        discovery: http://keycloak:8080/realms/dxlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
    upstream:
      type: roundrobin
      timeout:
        connect: 6
        send: 60
        read: 120
      nodes:
        "workflow-bridge:3000": 1
  # Thiết bị OT không có tài khoản Keycloak: tự xác thực bằng token riêng của từng cảm biến (kiểm ở workflow-bridge), cổng chỉ giới hạn tần suất.
  - id: data-read
    uris: ["/signatures/*", "/pki/*", "/ngsi-ld/*", "/orgs/*"]
    plugins:
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "GET,POST,PATCH,DELETE,OPTIONS"
        allow_headers: "authorization,content-type,x-hasura-role"
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      openid-connect:
        client_id: dxlab-app
        client_secret: not-used-public-client
        discovery: http://keycloak:8080/realms/dxlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
    upstream:
      type: roundrobin
      timeout:
        connect: 6
        send: 60
        read: 120
      nodes:
        "workflow-bridge:3000": 1
  # Thiết bị OT không có tài khoản Keycloak: tự xác thực bằng token riêng của từng cảm biến (kiểm ở workflow-bridge), cổng chỉ giới hạn tần suất.
  - id: telemetry
    uris: ["/telemetry/*"]
    plugins:
      limit-count:
        count: 600
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
    upstream:
      type: roundrobin
      nodes:
        "workflow-bridge:3000": 1
  - id: search
    uris: ["/search", "/ask"]
    plugins:
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "POST,OPTIONS"
        allow_headers: "authorization,content-type,x-hasura-role"
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      openid-connect:
        client_id: dxlab-app
        client_secret: not-used-public-client
        discovery: http://keycloak:8080/realms/dxlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
    upstream:
      type: roundrobin
      nodes:
        "workflow-bridge:3000": 1
  - id: fill
    # Mỗi lượt gọi trợ lý AI (tốn phí, chậm): giới hạn chặt hơn tìm kiếm.
    uris: ["/fill"]
    plugins:
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "POST,OPTIONS"
        allow_headers: "authorization,content-type,x-hasura-role"
      limit-count:
        count: 10
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      openid-connect:
        client_id: dxlab-app
        client_secret: not-used-public-client
        discovery: http://keycloak:8080/realms/dxlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
    upstream:
      type: roundrobin
      nodes:
        "workflow-bridge:3000": 1
  - id: auth
    uris: ["/auth/*"]
    upstream:
      type: roundrobin
      nodes:
        "keycloak:8080": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/auth/(.*)", "/$1"]
# Một khóa global_rules duy nhất (YAML trùng khóa thì khóa sau đè khóa trước).
global_rules:
  - id: metrics
    plugins:
      prometheus:
        prefer_name: true
  # Mỗi yêu cầu qua cổng mang một mã X-Request-Id, chuyển xuống dịch vụ phía sau và trả lại trong phản hồi; nhật ký của cổng và của
  # workflow-bridge cùng ghi mã này và trace_id để ghép hành trình một yêu cầu với chuỗi span trong Jaeger.
  # Mã do bên gọi gửi chỉ được giữ khi đúng dạng [A-Za-z0-9._:-]{1,128}; sai dạng (ký tự lạ, quá dài, gửi hai lần) thì cổng thay bằng
  # UUID mới, để không ai chèn ký tự điều khiển hay chuỗi rất dài vào nhật ký. Mã vẫn do bên gọi chọn được: chỉ dùng để ghép nhật ký,
  # không dùng để xác thực hay phân quyền. serverless-pre-function (ưu tiên 10000) chạy sau request-id (12015) trong cùng pha rewrite.
  - id: trace
    plugins:
      # Truy vết phân tán OpenTelemetry: mỗi yêu cầu một span SERVER, gửi traceparent (W3C) xuống Hasura, workflow-bridge;
      # bridge tạo span con cho từng lần gọi Hasura, Flowable, SeaweedFS, câu SQL (services/workflow-bridge/trace.js).
      # OTEL_SAMPLER: always_off (mặc định, không gửi span), always_on, hoặc parent_base (theo bên gọi).
      opentelemetry:
        sampler:
          name: ${{OTEL_SAMPLER:=always_off}}
      request-id:
        header_name: X-Request-Id
        include_in_response: true
        algorithm: uuid
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local id = ngx.req.get_headers()["X-Request-Id"]
              if type(id) ~= "string" or not ngx.re.find(id, [[^[A-Za-z0-9._:-]{1,128}$]], "jo") then
                id = require("resty.jit-uuid")()
                core.request.set_header(ctx, "X-Request-Id", id)
                ctx["request-id-X-Request-Id"] = id
              end
            end
#END
