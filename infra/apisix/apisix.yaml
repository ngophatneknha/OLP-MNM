# Cổng vào duy nhất của ứng dụng. Route nghiệp vụ bắt buộc có JWT hợp lệ của Keycloak
# (kiểm tra chữ ký bằng JWKS ngay tại biên), có CORS và giới hạn tần suất.
# Biến ${{...}} lấy từ môi trường của container (xem docker-compose.yml).

routes:
  - id: graphql
    uri: /v1/graphql
    enable_websocket: true
    plugins:
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "POST,OPTIONS"
        allow_headers: "authorization,content-type,x-hasura-role"
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      openid-connect:
        client_id: dxlab-app
        client_secret: not-used-public-client
        discovery: http://keycloak:8080/realms/dxlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
    upstream:
      type: roundrobin
      nodes:
        "hasura:8080": 1
  - id: files
    uris: ["/files", "/files/*"]
    plugins:
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "authorization,content-type,x-hasura-role,x-submission-id,x-file-name"
      limit-count:
        count: 60
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      openid-connect:
        client_id: dxlab-app
        client_secret: not-used-public-client
        discovery: http://keycloak:8080/realms/dxlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
    upstream:
      type: roundrobin
      nodes:
        "workflow-bridge:3000": 1
  - id: events
    uris: ["/events"]
    plugins:
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "GET,OPTIONS"
        allow_headers: "authorization,x-hasura-role"
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      openid-connect:
        client_id: dxlab-app
        client_secret: not-used-public-client
        discovery: http://keycloak:8080/realms/dxlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
    upstream:
      type: roundrobin
      timeout:
        connect: 6
        send: 6
        read: 3600
      nodes:
        "workflow-bridge:3000": 1
  - id: search
    uris: ["/search", "/ask"]
    plugins:
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "POST,OPTIONS"
        allow_headers: "authorization,content-type,x-hasura-role"
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
      openid-connect:
        client_id: dxlab-app
        client_secret: not-used-public-client
        discovery: http://keycloak:8080/realms/dxlab/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
    upstream:
      type: roundrobin
      nodes:
        "workflow-bridge:3000": 1
  - id: auth
    uris: ["/auth/*"]
    upstream:
      type: roundrobin
      nodes:
        "keycloak:8080": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/auth/(.*)", "/$1"]
global_rules:
  - id: metrics
    plugins:
      prometheus:
        prefer_name: true
#END
