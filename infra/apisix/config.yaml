deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

# Số đo cho Prometheus (docker-compose.optional.yml, profile monitoring). Cổng 9091 chỉ nằm trong mạng nội bộ, không công bố ra máy chủ.
plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091

# Nhật ký truy cập dạng JSON một dòng (để bộ gom nhật ký Vector đọc thẳng, profile logs), có mã truy vết request_id.
# Không ghi chuỗi truy vấn hay tiêu đề xác thực: chỉ phương thức, đường dẫn, mã trạng thái, thời gian.
nginx_config:
  http:
    access_log_format: '{"ts":"$time_iso8601","svc":"apisix","method":"$request_method","path":"$uri","status":$status,"ms":$request_time,"request_id":"$http_x_request_id"}'
    access_log_format_escape: json
